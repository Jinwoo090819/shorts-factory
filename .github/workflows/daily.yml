name: Daily Shorts Factory

on:
  schedule:
    # 07:30 UTC = 16:30 KST. Build first, then Buffer schedules 19:00 KST.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build-stage-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/main.py build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload media staging site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy media staging site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for public MP4
        env:
          MEDIA_URL: ${{ steps.deployment.outputs.page_url }}short.mp4
        run: |
          echo "Waiting for $MEDIA_URL"
          for i in 1 2 3 4 5 6; do
            if curl -fLsS -o /dev/null "$MEDIA_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Media URL did not become reachable"
          exit 1

      - name: Schedule YouTube Short through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          MEDIA_URL: ${{ steps.deployment.outputs.page_url }}short.mp4
        run: python src/main.py publish

      - name: Commit scheduling state
        if: success()
        run: |
          git config user.name 'shorts-factory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.json data/scripts || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Buffer scheduled short'
            git push
          fi

      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-short
          path: output/
          if-no-files-found: ignore
          retention-days: 3
