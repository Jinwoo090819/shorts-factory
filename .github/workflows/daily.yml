name: Daily Shorts Factory

on:
  schedule:
    # Backup retries for the three daily publishing slots (KST).
    # 22:00 UTC = 07:00 KST, 03:00 UTC = 12:00 KST, 09:00 UTC = 18:00 KST.
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/scripts/**'

concurrency:
  group: shorts-factory
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build-stage-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for ready script
        id: ready
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          found = False
          for path in sorted(Path('data/scripts').glob('*.json')):
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              items = raw if isinstance(raw, list) else [raw] if isinstance(raw, dict) else []
              if any(isinstance(x, dict) and str(x.get('status', 'ready')).lower() == 'ready' for x in items):
                  found = True
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"has_ready={'true' if found else 'false'}\n")
          print('ready script:', found)
          PY

      - name: Set up Python
        if: steps.ready.outputs.has_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and fonts
        if: steps.ready.outputs.has_ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        if: steps.ready.outputs.has_ready == 'true'
        run: pip install -r requirements.txt

      - name: Build Short with Edge TTS + generated BGM
        if: steps.ready.outputs.has_ready == 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ko-KR-HyunsuNeural
        run: python src/main_fixed.py build

      - name: Configure GitHub Pages
        if: steps.ready.outputs.has_ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload media staging site
        if: steps.ready.outputs.has_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy media staging site
        if: steps.ready.outputs.has_ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for public MP4
        if: steps.ready.outputs.has_ready == 'true'
        env:
          MEDIA_URL: ${{ steps.deployment.outputs.page_url }}short.mp4
        run: |
          echo "Waiting for $MEDIA_URL"
          for i in 1 2 3 4 5 6; do
            if curl -fLsS -o /dev/null "$MEDIA_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Media URL did not become reachable"
          exit 1

      - name: Schedule YouTube Short through Buffer
        if: steps.ready.outputs.has_ready == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          MEDIA_URL: ${{ steps.deployment.outputs.page_url }}short.mp4
        run: python src/main_fixed.py publish

      - name: Commit scheduling state
        if: steps.ready.outputs.has_ready == 'true' && success()
        run: |
          git config user.name 'shorts-factory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/history.json data/scripts || true
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] chore: record Buffer scheduled short'
            git push
          fi

      - name: Upload render artifact
        if: steps.ready.outputs.has_ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-short
          path: output/
          if-no-files-found: ignore
          retention-days: 3
