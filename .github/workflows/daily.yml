name: Daily Shorts Factory

on:
  schedule:
    # Backup retries for the three daily publishing slots (KST).
    # 22:00 UTC = 07:00 KST, 03:00 UTC = 12:00 KST, 09:00 UTC = 18:00 KST.
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/scripts/**'
      - '.github/workflows/daily.yml'

concurrency:
  group: shorts-factory
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-stage-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      OUTPUT_DIR: output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ready script
        id: ready
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          found = False
          for path in sorted(Path('data/scripts').glob('*.json')):
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              items = raw if isinstance(raw, list) else [raw] if isinstance(raw, dict) else []
              if any(isinstance(x, dict) and str(x.get('status', 'ready')).lower() == 'ready' for x in items):
                  found = True
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"has_ready={'true' if found else 'false'}\n")
          print('ready script:', found)
          PY

      - name: Set up Python
        if: steps.ready.outputs.has_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and fonts
        if: steps.ready.outputs.has_ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        if: steps.ready.outputs.has_ready == 'true'
        run: pip install -r requirements.txt

      - name: Allow longer narration
        if: steps.ready.outputs.has_ready == 'true'
        run: |
          sed -i 's/MAX_NARRATION_SECONDS = 85.0/MAX_NARRATION_SECONDS = 170.0/' src/main_fixed.py

      - name: Build and schedule all ready Shorts
        if: steps.ready.outputs.has_ready == 'true'
        shell: bash
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ko-KR-HyunsuNeural
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'shorts-factory-bot'
          git config user.email 'actions@users.noreply.github.com'

          if ! gh release view shorts-media >/dev/null 2>&1; then
            gh release create shorts-media \
              --title 'Shorts media staging' \
              --notes 'Temporary uniquely named media files used by the automated Shorts publishing pipeline.'
          fi

          mkdir -p output/media output/batch

          # Normal daily target is three Shorts. Process up to three ready scripts
          # in this run so the morning/lunch/evening videos can all be prepared
          # together as soon as the 05:00 script batch lands.
          for batch_index in 1 2 3; do
            if ! python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('data/scripts').glob('*.json')):
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              items = raw if isinstance(raw, list) else [raw] if isinstance(raw, dict) else []
              if any(isinstance(x, dict) and str(x.get('status', 'ready')).lower() == 'ready' for x in items):
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              echo 'No more ready scripts.'
              break
            fi

            echo "Building batch item ${batch_index}..."
            python src/main_fixed.py build

            MEDIA_FILENAME="$(python - <<'PY'
          import json, re, shutil
          from pathlib import Path

          meta = json.loads(Path('output/post.json').read_text(encoding='utf-8'))
          script_stem = Path(str(meta.get('script_file') or 'short')).stem
          fact_key = str(meta.get('fact_key') or 'fact')
          raw_name = f"{script_stem}-{fact_key}"
          safe_name = re.sub(r'[^A-Za-z0-9._-]+', '-', raw_name).strip('-._') or 'short'
          filename = safe_name[:140] + '.mp4'

          media_dir = Path('output/media')
          media_dir.mkdir(parents=True, exist_ok=True)
          target = media_dir / filename
          shutil.copy2('output/short.mp4', target)

          batch_dir = Path('output/batch')
          batch_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2('output/post.json', batch_dir / f'{safe_name[:140]}.json')
          print(filename)
          PY
          )"

            MEDIA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/shorts-media/${MEDIA_FILENAME}"
            echo "Uploading ${MEDIA_FILENAME}"
            gh release upload shorts-media "output/media/${MEDIA_FILENAME}#${MEDIA_FILENAME}" --clobber

            echo "Waiting for ${MEDIA_URL}"
            ready_url=false
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl -fLsS -o /dev/null "$MEDIA_URL"; then
                ready_url=true
                break
              fi
              sleep 10
            done
            if [ "$ready_url" != true ]; then
              echo "Unique media URL did not become reachable: ${MEDIA_URL}"
              exit 1
            fi

            MEDIA_URL="$MEDIA_URL" python src/main_fixed.py publish

            # Persist each successful Buffer schedule before starting the next
            # video. This prevents an error on a later item from causing an
            # already-scheduled Short to be scheduled again on retry.
            git add data/history.json data/scripts || true
            if ! git diff --cached --quiet; then
              git commit -m '[skip ci] chore: record Buffer scheduled short'
              if ! git push; then
                git pull --rebase
                git push
              fi
            fi
          done

      - name: Clean release media older than 14 days
        if: steps.ready.outputs.has_ready == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          cutoff = datetime.now(timezone.utc) - timedelta(days=14)
          data = subprocess.check_output([
              'gh', 'api', f'repos/{repo}/releases/tags/shorts-media'
          ], text=True)
          release = json.loads(data)
          for asset in release.get('assets', []):
              created = datetime.fromisoformat(asset['created_at'].replace('Z', '+00:00'))
              if created < cutoff:
                  subprocess.run([
                      'gh', 'api', '-X', 'DELETE',
                      f"repos/{repo}/releases/assets/{asset['id']}"
                  ], check=True)
                  print('deleted old media asset:', asset.get('name'))
          PY

      - name: Upload render artifact
        if: steps.ready.outputs.has_ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 3
